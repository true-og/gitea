# /etc/nginx/sites-available/gitea.conf
# Gitea reverse proxy – canonical host: git.trueog.net

# Per-visitor limits for the fork banner's count route (one request per page view). The visitor's real
# address comes from conf.d/cloudflare-realip.conf.
limit_req_zone $binary_remote_addr zone=trueog_divergence:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=trueog_divergence_conn:10m;

############################################################
# 1. HTTP: ACME for BOTH hosts + redirect to canonical
############################################################
server {
    listen 80;
    server_name git.trueog.net git.true-og.net;

    # Certbot / ACME
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else → canonical HTTPS
    location / {
        return 301 https://git.trueog.net$request_uri;
    }
}

############################################################
# 2. HTTPS: canonical Gitea vhost (only git.trueog.net)
############################################################
server {
    listen 443 ssl;
    #listen [::]:443 ssl http2;
    http2 on;

    server_name git.trueog.net;

    # ─── TLS ───────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/trueog-combined/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trueog-combined/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    ########################################################
    # Reverse-proxy to Gitea (127.0.0.1:3000)
    ########################################################
    client_max_body_size 512M;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    proxy_set_header Host              $host;   # will always be git.trueog.net now
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Credential-free pull indexes generated solely from Gitea's anonymous API. Only explicit
    # public state views bypass Gitea; bare /pulls remains the native signed-in dashboard.
    # personal=hide selects the generated variant without personal (user-owned) repositories.
    location = /pulls {
        error_page 418 = @gitea_pulls_dashboard;
        set $trueog_public_pulls 0;
        if ($arg_state ~ "^(all|open|closed)$") { set $trueog_public_pulls 1; }
        if ($trueog_public_pulls = 0) { return 418; }
        set $trueog_pulls_prefix trueog-pulls-;
        if ($arg_personal = hide) { set $trueog_pulls_prefix trueog-pulls-org-; }
        set $trueog_pulls_page "${trueog_pulls_prefix}all.html";
        set $trueog_pulls_page_suffix "";
        if ($arg_page ~ "^([2-9]|[1-9][0-9]|100)$") { set $trueog_pulls_page_suffix "-page-$arg_page"; }
        if ($trueog_pulls_page_suffix != "") { set $trueog_pulls_page "${trueog_pulls_prefix}all$trueog_pulls_page_suffix.html"; }
        if ($arg_state = open) { set $trueog_pulls_page "${trueog_pulls_prefix}open.html"; }
        if ($arg_state = closed) { set $trueog_pulls_page "${trueog_pulls_prefix}closed.html"; }
        proxy_pass http://127.0.0.1:3000/assets/html/$trueog_pulls_page;
        include /etc/nginx/snippets/gitea-public-page-headers.conf;
    }

    # The same credential-free index for issues: explicit public state views are generated
    # files; bare /issues (and any other query) remains Gitea's native signed-in issue dashboard, which
    # the shared named location below proxies unchanged.
    location = /issues {
        error_page 418 = @gitea_pulls_dashboard;
        set $trueog_public_issues 0;
        if ($arg_state ~ "^(all|open|closed)$") { set $trueog_public_issues 1; }
        if ($trueog_public_issues = 0) { return 418; }
        set $trueog_issues_prefix trueog-issues-;
        if ($arg_personal = hide) { set $trueog_issues_prefix trueog-issues-org-; }
        set $trueog_issues_page "${trueog_issues_prefix}all.html";
        set $trueog_issues_page_suffix "";
        if ($arg_page ~ "^([2-9]|[1-9][0-9]|100)$") { set $trueog_issues_page_suffix "-page-$arg_page"; }
        if ($trueog_issues_page_suffix != "") { set $trueog_issues_page "${trueog_issues_prefix}all$trueog_issues_page_suffix.html"; }
        if ($arg_state = open) { set $trueog_issues_page "${trueog_issues_prefix}open.html"; }
        if ($arg_state = closed) { set $trueog_issues_page "${trueog_issues_prefix}closed.html"; }
        proxy_pass http://127.0.0.1:3000/assets/html/$trueog_issues_page;
        include /etc/nginx/snippets/gitea-public-page-headers.conf;
    }

    # Live ahead/behind counts for the fork banner (trueog-divergence on 127.0.0.1:3992). The visitor's
    # cookies reach only that service, which shows them only to Gitea to confirm read access.
    location = /-/trueog-divergence {
        limit_except GET { deny all; }
        limit_req zone=trueog_divergence burst=30 nodelay;
        limit_req_status 429;
        limit_conn trueog_divergence_conn 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3992;
        proxy_read_timeout 60s;
    }

    # Native signed-in /pulls and /issues dashboards (any request the public views above do not take).
    location @gitea_pulls_dashboard {
        proxy_buffers 8 1024k;
        proxy_buffer_size 1024k;
        proxy_busy_buffers_size 2048k;
        proxy_temp_file_write_size 2048k;

        proxy_pass http://127.0.0.1:3000;
    }

    # Repository-selection pages. Each choice links to Gitea's native issue-template, pull-list, or
    # fork flow, where authentication and repository permissions continue to be enforced.
    location = /contribute/pull-request {
        proxy_pass http://127.0.0.1:3000/assets/html/trueog-pull-wizard.html;
        include /etc/nginx/snippets/gitea-public-page-headers.conf;
    }

    location = /contribute/bug-report {
        proxy_pass http://127.0.0.1:3000/assets/html/trueog-bug-wizard.html;
        include /etc/nginx/snippets/gitea-public-page-headers.conf;
    }

    location / {
        proxy_buffers 8 1024k;
        proxy_buffer_size 1024k;
        proxy_busy_buffers_size 2048k;
        proxy_temp_file_write_size 2048k;

        proxy_pass http://127.0.0.1:3000;
    }

    # Optional metrics
    # location /metrics {
    #     proxy_pass http://127.0.0.1:3000/metrics;
    #     allow 127.0.0.1;
    #     deny  all;
    # }
}

############################################################
# 3. HTTPS: alias host – just redirect to canonical
############################################################
server {
    listen 443 ssl;
    #listen [::]:443 ssl http2;
    http2 on;

    server_name git.true-og.net;

    ssl_certificate     /etc/letsencrypt/live/trueog-combined/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trueog-combined/privkey.pem;

    return 301 https://git.trueog.net$request_uri;
}
